services:
  # Aplicação-alvo
  quickpizza:
    image: ghcr.io/grafana/quickpizza-local:latest
    ports:
      - "3333:3333"

  # Base de dados de métricas: recolhe as do QuickPizza (scrape) e recebe as do k6 (remote write)
  prometheus:
    image: prom/prometheus:v2.55.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver       # abre a porta de entrada para receber o que o k6 envia;
      - --enable-feature=native-histograms
      - --storage.tsdb.retention.time=7d         # apaga os dados com mais de 7 dias.
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - quickpizza

  # Visualização
  grafana:
    image: grafana/grafana:11.3.0
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/quickpizza.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

  # Sistema do trabalho final (API REST de estudo)
  serverest:
    image: paulogoncalvesbh/serverest:latest
    profiles: ["serverest"]
    ports:
      - "3000:3000"

  # Gerador de carga (só corre quando chamado: docker compose run ...)
  k6:
    image: grafana/k6:2.4.0
    profiles: ["k6"]
    environment:
      - BASE_URL=http://quickpizza:3333
      - K6_PROMETHEUS_RW_SERVER_URL=http://prometheus:9090/api/v1/write
      - K6_PROMETHEUS_RW_TREND_AS_NATIVE_HISTOGRAM=true
      - K6_PROMETHEUS_RW_PUSH_INTERVAL=5s
      - K6_WEB_DASHBOARD=true
      - K6_WEB_DASHBOARD_EXPORT=/scripts/report.html
    volumes:
      - ./k6:/scripts
    ports:
      - "5665:5665"
    depends_on:
      - quickpizza
      - prometheus

  # Mesmo k6, com o Chromium embutido (testes de navegador: k6/navegador.js)
  k6-navegador:
    extends: k6
    image: grafana/k6:2.4.0-with-browser
    shm_size: "1gb"
