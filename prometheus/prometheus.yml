global:
  scrape_interval: 5s                # de quanto em quanto tempo coletar os dados; o padrão é 1 min.

scrape_configs:
  - job_name: quickpizza             # nome do alvo; vira o rótulo job="quickpizza".
    static_configs:
      - targets: ["quickpizza:3333"] # endereço do alvo, dentro da rede do Docker. O caminho /metrics é o padrão e não precisa ser escrito.
